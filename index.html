/* ======================================================================
   MUSIC ANALYTICS - YouTube Music edition. Fixed 1280 x 720 canvas, scaled to fit the visual.
   Graphite glass by default, clean light mode on the toggle. One accent: YouTube Music red.
   ====================================================================== */
.ytm {
  --bg:#121217; --bg2:#1d1d25; --text:#f5f5f7; --muted:#a9a9b4; --faint:#73737f;
  --panel:rgba(255,255,255,.055); --panel2:rgba(30,30,38,.94); --line:rgba(255,255,255,.09); --hi:rgba(255,255,255,.08);
  --soft:rgba(255,255,255,.06); --soft2:rgba(255,255,255,.11); --grid:rgba(255,255,255,.07);
  --red:#ff0033; --red2:#c2002a; --rose:#ff5c7a; --ink2:#ececf1; --grey:#5a5a66; --dotbg:#1b1b22;
  --glow:rgba(255,0,51,.45); --shadow:0 18px 40px -20px rgba(0,0,0,.75);
  --b1:rgba(255,0,51,.22); --b2:rgba(255,40,90,.12); --b3:rgba(120,120,160,.10);
}
.ytm[data-theme=light] {
  --bg:#eef0f4; --bg2:#fbfbfd; --text:#15151b; --muted:#585864; --faint:#8b8b97;
  --panel:rgba(255,255,255,.70); --panel2:rgba(255,255,255,.97); --line:rgba(255,255,255,.95); --hi:rgba(255,255,255,1);
  --soft:rgba(20,20,40,.045); --soft2:rgba(20,20,40,.08); --grid:rgba(20,20,40,.07);
  --red:#f00030; --red2:#b80026; --rose:#ff4d6d; --ink2:#2b2b35; --grey:#c3c3cd; --dotbg:#ffffff;
  --glow:rgba(240,0,48,.30); --shadow:0 14px 32px -20px rgba(20,20,50,.35), 0 1px 3px rgba(20,20,50,.06);
  --b1:rgba(255,0,51,.10); --b2:rgba(255,90,120,.10); --b3:rgba(120,140,200,.14);
}
html, body { margin:0; height:100%; overflow:hidden; background:#eef0f4; }
.ytm * { box-sizing:border-box; }
.ytm { position:absolute; left:0; top:0; width:1280px; height:720px; transform-origin:0 0; overflow:hidden;
  font-family:"Segoe UI Variable Display","Segoe UI","Inter","Roboto",system-ui,sans-serif; font-size:12.5px; line-height:1.35;
  color:var(--text); -webkit-font-smoothing:antialiased; transition:color .4s;
  background:linear-gradient(155deg,var(--bg2) 0%,var(--bg) 70%); }
:where(.ytm) button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; text-align:inherit; }
.ytm h1, .ytm h2, .ytm h3, .ytm p { margin:0; }

/* ---------- soft moving light behind the glass */
.bg { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.bg i { position:absolute; border-radius:50%; filter:blur(80px); }
.bg .x1 { width:620px; height:520px; left:-200px; top:-220px; background:var(--b1); animation:dr1 24s ease-in-out infinite alternate; }
.bg .x2 { width:560px; height:480px; right:-180px; bottom:-240px; background:var(--b2); animation:dr2 28s ease-in-out infinite alternate; }
.bg .x3 { width:480px; height:420px; left:420px; top:220px; background:var(--b3); animation:dr1 32s ease-in-out infinite alternate-reverse; }
@keyframes dr1 { to { transform:translate(80px,50px) scale(1.12); } }
@keyframes dr2 { to { transform:translate(-70px,-40px) scale(1.1); } }

/* ---------- glass panel */
.g { position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow), inset 0 1px 0 var(--hi); backdrop-filter:blur(18px) saturate(150%); -webkit-backdrop-filter:blur(18px) saturate(150%);
  padding:11px 13px; overflow:hidden; animation:rise .55s cubic-bezier(.2,.8,.2,1) both; }
.gh { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; height:18px; }
.gh h2 { font-size:13px; font-weight:700; letter-spacing:.1px; white-space:nowrap; }
.gh small { color:var(--faint); font-size:10.5px; white-space:nowrap; }
@keyframes rise { from { opacity:0; transform:translateY(8px); } }
.ytm.still .g, .ytm.still .land * { animation-name:none; }
.drawer.stay { animation:none; }

/* ---------- header */
.top { position:absolute; left:16px; top:12px; width:1248px; height:50px; display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:16px; z-index:5; }
.brand { display:flex; align-items:center; gap:10px; padding-right:12px; }
.brand b { display:block; font-size:15px; letter-spacing:.1px; }
.brand small { display:block; font-size:10.5px; color:var(--muted); letter-spacing:.3px; }
.mark { width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 30% 25%,#ff4d6d,#ff0033 45%,#b0002a); display:flex; align-items:flex-end; justify-content:center; gap:2.5px; padding:0 8px 9px;
  box-shadow:0 6px 16px -6px var(--glow), inset 0 1px 0 rgba(255,255,255,.35); flex:none; }
.mark i { width:3px; background:#fff; border-radius:2px; animation:eq 1s ease-in-out infinite alternate; transform-origin:bottom; }
@keyframes eq { from { transform:scaleY(.45); } to { transform:scaleY(1.05); } }
.nav { display:flex; gap:6px; margin-left:auto; }
.nb { display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px; border-radius:11px; background:var(--soft); border:1px solid var(--line) !important;
  color:var(--muted); font-weight:650; transition:.2s; }
.nb svg { width:16px; height:16px; }
.nb:hover { color:var(--text); background:var(--soft2); }
.nb.on { color:var(--text); background:var(--soft2); box-shadow:inset 0 -2px 0 var(--red); }
.btn { display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 13px; border-radius:11px; background:var(--soft); border:1px solid var(--line) !important; font-weight:650; transition:.2s; }
.btn:hover { background:var(--soft2); }
.btn.red { background:linear-gradient(135deg,var(--red),var(--red2)); color:#fff; border-color:transparent !important; box-shadow:0 8px 18px -8px var(--glow); }
.btn em { font-style:normal; min-width:19px; height:19px; border-radius:99px; background:#fff; color:var(--red2); font-size:11px; font-weight:800; display:inline-grid; place-items:center; }
.btn.ic { width:36px; padding:0; justify-content:center; }
.btn svg { width:16px; height:16px; }
.sep { width:1px; height:26px; background:var(--line); margin:0 2px; }
.chips { position:absolute; left:20px; top:68px; width:1240px; height:22px; display:flex; gap:6px; align-items:center; overflow:hidden; z-index:4; }
.chip { padding:2px 10px; border-radius:99px; background:rgba(255,0,51,.14); border:1px solid rgba(255,0,51,.45) !important; font-weight:650; font-size:11.5px; animation:rise .25s both; }
.chip b { opacity:.7; margin-left:4px; }
.hint { color:var(--faint); font-size:11px; }
.foot { margin-left:auto; color:var(--faint); font-size:10.5px; white-space:nowrap; }
.main { position:absolute; left:16px; top:94px; width:1248px; height:612px; }

/* ---------- covers */
.cv { display:block; object-fit:cover; flex:none; background:var(--soft2); }
.cvf { display:grid; place-items:center; color:#fff; font-weight:800; flex:none; text-shadow:0 1px 6px rgba(0,0,0,.35); }
.av { border-radius:50%; flex:none; display:grid; place-items:center; color:#fff; font-weight:800; }

/* ---------- song list (left column) */
.list h2 { font-size:15px; font-weight:750; }
.list .sub { color:var(--faint); font-size:10.5px; margin:1px 0 8px; }
.search { display:flex; align-items:center; gap:7px; height:32px; padding:0 10px; border-radius:10px; background:var(--soft); border:1px solid var(--line); color:var(--faint); margin-bottom:8px; }
.search svg { width:15px; height:15px; flex:none; }
.search input { flex:1; min-width:0; border:0; outline:0; background:none; color:var(--text); font:inherit; }
.sl-list { position:absolute; left:8px; right:6px; top:96px; bottom:8px; overflow-y:auto; padding-right:4px; }
.sl-list::-webkit-scrollbar { width:5px; } .sl-list::-webkit-scrollbar-thumb { background:var(--soft2); border-radius:9px; }
.song { display:grid; grid-template-columns:42px 1fr; gap:10px; align-items:center; width:100%; padding:6px 8px; margin-bottom:5px; border-radius:11px;
  background:var(--soft); border:1px solid transparent !important; transition:background .2s, transform .2s; animation:rise .4s both; }
.song:hover { background:var(--soft2); transform:translateX(2px); }
.song.on { background:rgba(255,0,51,.16); border-color:rgba(255,0,51,.55) !important; }
.song small { display:block; color:var(--muted); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.song b { display:block; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ---------- KPI stack */
.kp { display:flex; flex-direction:column; justify-content:center; text-align:center; padding:6px 10px !important; }
.kp span { color:var(--muted); font-size:11.5px; font-weight:650; }
.kp strong { font-size:27px; font-weight:800; letter-spacing:-.6px; line-height:1.1; font-variant-numeric:tabular-nums; }
.kp small { color:var(--faint); font-size:10.5px; }
.kp::before { content:""; position:absolute; left:50%; top:0; width:44px; margin-left:-22px; height:3px; border-radius:0 0 4px 4px; background:var(--red); }
.kp .wave { position:absolute; left:0; right:0; bottom:0; height:28px; opacity:.5; pointer-events:none; }

/* ---------- now-playing card */
.player { background:linear-gradient(160deg,#ff2a55 0%,#e0002e 45%,#9e0024 100%) !important; border-color:rgba(255,255,255,.25) !important; color:#fff; padding:12px !important;
  box-shadow:0 22px 40px -18px rgba(255,0,51,.6), inset 0 1px 0 rgba(255,255,255,.35) !important; }
.player .art { position:relative; border-radius:12px; overflow:hidden; box-shadow:0 14px 30px -12px rgba(0,0,0,.6); }
.player .art .cv, .player .art .cvf { width:100% !important; height:100% !important; border-radius:0 !important; }
.player .art .meta { position:absolute; left:0; right:0; bottom:0; padding:30px 12px 10px; background:linear-gradient(180deg,transparent,rgba(0,0,0,.78)); }
.player .art .meta b { display:block; font-size:15px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player .art .meta small { display:block; font-size:11.5px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player .badge { position:absolute; left:10px; top:10px; padding:3px 8px; border-radius:99px; background:rgba(0,0,0,.45); backdrop-filter:blur(6px); font-size:10.5px; font-weight:800; letter-spacing:.6px; }
.player .prog { height:4px; border-radius:99px; background:rgba(255,255,255,.3); margin:10px 2px 4px; overflow:hidden; }
.player .prog i { display:block; height:100%; background:#fff; border-radius:99px; transform-origin:left; animation:gx 1.1s cubic-bezier(.2,.8,.2,1) both; }
.player .times { display:flex; justify-content:space-between; font-size:10.5px; opacity:.85; padding:0 2px; }
.player .ctl { display:flex; justify-content:center; align-items:center; gap:22px; margin-top:4px; }
.player .ctl button { width:34px; height:34px; display:grid; place-items:center; border-radius:50%; transition:.2s; }
.player .ctl button:hover { background:rgba(255,255,255,.18); }
.player .ctl button.pp { width:42px; height:42px; background:#fff; color:#d0002c; box-shadow:0 6px 14px -6px rgba(0,0,0,.5); }

  function songList(stats, x, h) {
    var list = Object.keys(stats).map(function (k) { return stats[k]; }).sort(function (a, b) { return b.points - a.points; });
    var q = S.q.toLowerCase(), shown = q ? list.filter(function (s) { return (tracks[s.ti].t + " " + tracks[s.ti].a).toLowerCase().indexOf(q) >= 0; }) : list;
    var sel = selected(stats);
    var items = shown.slice(0, 150).map(function (s, i) {
      var t = tracks[s.ti];
      return '<button class="song' + (s.ti === sel ? " on" : "") + '" data-act="pick" data-v="' + s.ti + '" style="animation-delay:' + Math.min(i, 12) * 30 + 'ms"' +
        tipAttr(t.t, [["Artist", t.a], ["Days on chart", s.days], ["Best rank", "#" + s.best]]) + ">" + cover(t, 42, 8) +

  function ordered(stats) {

    var x = parseInt(old.style.left), y = parseInt(old.style.top), w = parseInt(old.style.width), h = parseInt(old.style.height);
    var tmp = document.createElement("div"); tmp.innerHTML = player(stats, x, y, w, h, D.n);
    old.parentNode.replaceChild(tmp.firstChild, old);
    var list = root.querySelectorAll(".song"); for (var i = 0; i < list.length; i++) list[i].classList.toggle("on", +list[i].getAttribute("data-v") === ti);
    var on = root.querySelector(".song.on"); if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }
  function step(dir) {
    var rows = rowsFor(), stats = trackStats(rows), o = ordered(stats).map(function (z) { return z.ti; });
    var q = S.q.toLowerCase(); if (q) o = o.filter(function (t2) { return (tracks[t2].t + " " + tracks[t2].a).toLowerCase().indexOf(q) >= 0; });
    if (!o.length) return;
    var i = o.indexOf(selected(stats)); swapSong(o[(i + dir + o.length) % o.length]);
  }
  function animateCounts() {
    var els = root.querySelectorAll("[data-count]"), t0 = performance.now();
    function tick(now) {
      var p = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - p, 3);
      for (var i = 0; i < els.length; i++) { var el = els[i]; el.textContent = FMTS[el.getAttribute("data-fmt")](+el.getAttribute("data-count") * e); }
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
  function scale() {
    var w = window.innerWidth || document.documentElement.clientWidth, h = window.innerHeight || document.documentElement.clientHeight;
    var s = Math.min(w / 1280, h / 720);
    root.style.transform = "scale(" + s + ")";
    root.style.left = Math.max(0, (w - 1280 * s) / 2) + "px"; root.style.top = Math.max(0, (h - 720 * s) / 2) + "px";
    root.setAttribute("data-scale", s);
  }

  /* ---------------------------------------------------------------- EVENTS (delegated) */
  function toggleX(k, v) { if (S.x[k] === v) delete S.x[k]; else S.x[k] = v; }
  function stopPlay() { S.playing = false; if (playTimer) { clearInterval(playTimer); playTimer = null; } }
  root.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]"); if (!el) return;
    var a = el.getAttribute("data-act"), v = el.getAttribute("data-v");
    if (a === "pick") { stopPlay(); swapSong(+v); return; }
    if (a === "prev" || a === "next") { step(a === "next" ? 1 : -1); return; }
    if (a === "play") {
      if (S.playing) stopPlay(); else { S.playing = true; playTimer = setInterval(function () { step(1); }, 4000); }
      swapSong(S.track != null ? S.track : selected(trackStats(rowsFor()))); return;
    }
    if (a === "tab") { stopPlay(); S.tab = v; S.q = ""; }
    else if (a === "theme") { S.theme = S.theme === "dark" ? "light" : "dark"; try { localStorage.setItem("ytm-theme", S.theme); } catch (er) { } }
    else if (a === "reset") { S.f = { months: [], types: [], content: [], bands: [] }; S.x = {}; }
    else if (a === "drawer") { S.drawer = true; S.drawerOpen = false; S.draft = JSON.parse(JSON.stringify(S.f)); document.getElementById("drw").innerHTML = drawerHtml(); S.drawerOpen = true; return; }
    else if (a === "close") { S.drawer = false; document.getElementById("drw").innerHTML = ""; return; }
    else if (a === "dt") { var f = el.getAttribute("data-f"), val = f === "types" ? +v : v, arr = S.draft[f], ix = arr.indexOf(val); if (ix >= 0) arr.splice(ix, 1); else arr.push(val); }
    else if (a === "yall") { var ms = months.filter(function (m) { return m.slice(0, 4) === v; }), allOn = ms.every(function (m) { return S.draft.months.indexOf(m) >= 0; }); S.draft.months = S.draft.months.filter(function (m) { return m.slice(0, 4) !== v; }); if (!allOn) S.draft.months = S.draft.months.concat(ms); }
    else if (a === "dclear") { S.draft = { months: [], types: [], content: [], bands: [] }; }
    else if (a === "apply") { S.f = S.draft; S.drawer = false; S.drawerOpen = false; }
    else if (a === "rm") { var k = el.getAttribute("data-k"), fl = el.getAttribute("data-f"); if (k === "x") delete S.x[fl]; else S.f[fl] = S.f[fl].filter(function (z) { return String(z) !== v; }); }
    else if (a === "artist") { toggleX("artist", v); }
    else if (a === "type") { toggleX("type", +v); }
    else if (a === "content") { toggleX("content", v); }
    else if (a === "month") { toggleX("month", v); }
    else if (a === "asort") { S.asort = v; }
    else if (a === "ssort") { S.ssort = v; }
    else return;
    if (a === "dt" || a === "yall" || a === "dclear") { document.getElementById("drw").innerHTML = drawerHtml(); return; }
    hideTip(); render(a === "tab", a === "asort" || a === "ssort");
  });
  root.addEventListener("input", function (e) { if (e.target.id === "q") { S.q = e.target.value; render(false, true); } });
  function hideTip() { if (tipEl) tipEl.style.display = "none"; }
  root.addEventListener("mousemove", function (e) {
    var el = e.target.closest("[data-tt]"); if (!el || !tipEl) { hideTip(); return; }
    var parts = el.getAttribute("data-tt").split("~"), s = +root.getAttribute("data-scale") || 1, rc = root.getBoundingClientRect();
    tipEl.innerHTML = '<b class="tt">' + esc(parts[0]) + "</b>" + parts.slice(1).map(function (p) { var kv = p.split("^"); return "<div><span>" + esc(kv[0]) + "</span><b>" + esc(kv[1]) + "</b></div>"; }).join("");
    var x = (e.clientX - rc.left) / s + 14, y = (e.clientY - rc.top) / s + 14;
    tipEl.style.display = "block";
    tipEl.style.left = Math.min(x, 1280 - tipEl.offsetWidth - 8) + "px"; tipEl.style.top = Math.min(y, 720 - tipEl.offsetHeight - 8) + "px";
  });
  root.addEventListener("mouseleave", hideTip);
  root.addEventListener("error", function (e) {
    var im = e.target; if (!im || im.tagName !== "IMG") return;
    im.style.display = "none"; var nx = im.nextElementSibling; if (nx) nx.style.display = nx.classList.contains("mark") ? "flex" : "grid";
  }, true);
  window.addEventListener("resize", scale);
  scale(); render(true);
})();
</script>
